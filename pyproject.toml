[project]
name = "researcher"
version = "0.1.0"
description = "Three-agent research system: orchestrator, researcher and creator produce a referenced PDF report."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.4",  # structured outputs (output_config) and top-level cache_control
    "langgraph>=0.2",
    "playwright>=1.45",
    "tavily-python>=0.5",
    "pydantic>=2.7",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyright>=1.1.400"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["prompts/*.md", "templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["app"]
venvPath = "."
venv = ".venv"
# LangGraph state is a TypedDict with optional keys; the graph's step order guarantees each key is
# set before a later step reads it, and the workflow tests cover every path.
reportTypedDictNotRequiredAccess = false
